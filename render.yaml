databases:
  - name: mzansibuilds-db
    plan: free
    databaseName: mzansibuilds
    user: mzansibuilds

services:
  - type: web
    name: mzansibuilds
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mzansibuilds-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
